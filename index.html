<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="style.css">
    <title>РУМТИБЕТ</title>
</head>
<body>
    <section class="start">
    <header class="header">
        <section class="header__section__main">
            <img class="header__logo" src="/img/logo.png" alt="">
            <nav class="header__nav">
                <ul class="nav-list">
                    <li class="nav-item"><a href="" class="nav__link">Главная</a></li>
                    <li class="nav-item"><a href="" class="nav__link">Про гида</a></li>
                    <li class="nav-item"><a href="" class="nav__link">Программа тура</a></li>
                    <li class="nav-item"><a href="" class="nav__link">Стоимость</a></li>
                    <li class="nav-item"><a href="" class="nav__link">Блог</a></li>
                    <li class="nav-item"><a href="" class="nav__link">Контакты</a></li>
                </ul>
            </nav>
            <button class="header__btn">Консультация</button>
        </section>
    </header>
        
        <section class="header__section__footer">
            <h1 class="main__h1">Насладись прогулкой в горах <br> с командой единомышленников</h1>
            <section class="start__forms">
                <article class="form-1">
                    <select class="start__select" name="tour" id="tour">
                        <option value="">Локация для тура</option>
                        <option value="">Озеро возле гор</option>
                        <option value="">Ночь в горах</option>
                        <option value="">Йога в горах</option>
                    </select>
                    <p class="select-hint">выберите из списка</p>
                </article>

                <article class="form-1">
                    <select class="start__select" name="tour" id="tour">
                        <option value="">Дата похода</option>
                        <option value="">-</option>
                        <option value="">-</option>
                        <option value="">-</option>
                    </select>
                    <p class="select-hint">укажите диапазон</p>
                </article>

                <article class="form-1">
                    <select class="start__select" name="tour" id="tour">
                        <option value="">Участники</option>
                        <option value="">4</option>
                        <option value="">5</option>
                        <option value="">6+</option>
                    </select>
                    <p class="select-hint">минимум 4 человека</p>
                </article>

                <button class="start__btn">Найти программу</button>
            </section>
        </section>

    </section>

    

    <script src="script.js"></script>
</body>
</html>
